# portfolio.masanco-hub.com — Mario Sanchis Colomer
# Public static site (Astro 6 static output). No auth required.
#
# Since the site moved into a container this vhost no longer serves files: it
# terminates TLS and proxies to the portfolio container on 127.0.0.1:8101.
# Cache policy and the ES/EN routing now live in deploy/docker/nginx-site.conf,
# inside the image, so they travel with the app to another server.

server {
    listen 80;
    server_name portfolio.masanco-hub.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name portfolio.masanco-hub.com;

    include /etc/nginx/snippets/common-ssl.conf;

    # Security headers stay at the edge: they are a property of how the site is
    # published, not of what it serves.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The CV PDFs are a few MB; no reason to buffer a request body at all here.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8101;

        # 1.1 keeps the upstream connection alive between requests; with the
        # default 1.0 nginx opens a new socket per asset.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # If the container is down or mid-rebuild, fail fast instead of holding
        # the client for the default 60s.
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
