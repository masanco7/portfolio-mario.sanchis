# Fixed project name: without it Compose derives one from the folder name
# ("docker"), and on a server running several apps that is asking for a clash.
name: portfolio

services:
  portfolio:
    build:
      # The context is the repo root: package.json, src/ and public/ live two
      # levels above this file.
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        REVISION: ${REVISION:-unknown}
    # Mobile tag pointing at the known-good image. Promotion and rollback are
    # done by retagging, not by rebuilding — see "Rollback" in deploy/README.md.
    image: portfolio-masanco-hub:actual
    container_name: portfolio-web
    restart: unless-stopped
    ports:
      # Localhost only: the one publishing to the internet is nginx on the host,
      # which terminates TLS. 8000 and 8001 are the bare-metal APIs (polybot and
      # gym) and 8100 is integras, so containerised apps take the 81xx range.
      - "127.0.0.1:${PORTFOLIO_PORT:-8101}:8080"
    # The whole site is baked into the image and nothing writes at runtime, so
    # the filesystem can be read-only. nginx still needs somewhere to put its
    # pid file and its temp dirs; the uid/gid match the image's `nginx` user,
    # otherwise a tmpfs mounts owned by root and nginx cannot write to it.
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101
      - /var/cache/nginx:uid=101,gid=101
    logging:
      # Without a cap the JSON log grows until it fills the disk.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Static files, no long-lived connections to drain.
    stop_grace_period: 10s

    # Phase 2 (2026-09-10): the container also joins the shared `edge` network,
    # where the proxy reaches it as `portfolio-web:8080`.
    #
    # The `ports:` block above stays for now on purpose. Publishing on 127.0.0.1
    # costs nothing and keeps the old host-nginx path working, so joining the
    # network is reversible and causes no downtime. Drop it once the edge
    # cutover has been stable for a few days.
    #
    # `default` has to be listed explicitly: declaring any network on a service
    # stops Compose adding the implicit one.
    networks:
      - default
      - edge

networks:
  edge:
    # Created by hand with `docker network create edge`, shared with gym,
    # polybot and the proxy. External so a `compose down` of any single app
    # cannot take it away from the others.
    external: true
