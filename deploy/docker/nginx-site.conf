# Internal vhost for the portfolio container. TLS, HTTP/2, the real server_name
# and the security headers are the proxy's job; everything here is about serving
# files and getting the cache headers right.
#
# This replaces /etc/nginx/conf.d/default.conf in the nginx-unprivileged image,
# which is why it listens on 8080 and not 80: the image runs as a non-root user
# and cannot bind a privileged port.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Without this the access log records the Docker gateway on every request.
    # The range covers Docker's default bridge networks; the port is published
    # on 127.0.0.1 only, so nothing off-host can reach it to spoof the header.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Default for anything without a rule of its own — in practice the HTML.
    # It must always be revalidated: the assets it points at are content-hashed,
    # so a browser holding a stale index.html also holds the stale asset hashes
    # and the deploy stays invisible. This sits at server level on purpose:
    # nginx only inherits add_header into locations that declare none of their
    # own, so each asset block below silently overrides it, which is what we want.
    add_header Cache-Control "public, max-age=0, must-revalidate" always;

    # Compression happens here because a proxy passes the response body through
    # untouched. Images and PDFs are left alone — they are already compressed.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Hashed static assets: Astro emits content-hashed CSS/JS/images under
    # /_astro/, so the filename changes whenever the content does and the cache
    # can be immutable for a year.
    # One explicit Cache-Control instead of `expires` + `add_header`: those two
    # each emit their own Cache-Control and the response goes out with the
    # header twice, which leaves Cloudflare and the browser to pick one.
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Project images keep their name across builds, so a shorter window: to
    # update one, change its filename.
    location ^~ /projects/ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    # CV PDFs — short cache so a new CV propagates within the hour instead of
    # sitting stale in a recruiter's browser.
    location ~* ^/cv-.*\.pdf$ {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location ~* \.(svg|png|jpg|jpeg|webp|ico|woff2?|ttf)$ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # English routes — Astro generates /en/index.html. The exact-match block
    # catches /en with no trailing slash, which try_files alone would 404.
    location /en/ {
        try_files $uri $uri/ $uri/index.html =404;
    }
    location = /en {
        try_files /en/index.html =404;
    }

    # Default locale (Spanish) at the root.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
